[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram-bot-codex"
version = "0.1.0"
description = "Production-oriented Telegram RPG bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.7.0",
  "sqlalchemy>=2.0.31",
  "asyncpg>=0.29.0",
  "alembic>=1.13.2",
  "redis>=5.0.7",
  "pydantic-settings>=2.3.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.8",
  "ruff>=0.5.5",
  "black>=24.4.2",
  "isort>=5.13.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
